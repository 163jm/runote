[package]
name = "runote"
version = "0.1.0"
edition = "2021"
description = "RuNote - 现代、简单、轻量的 Windows 便签，自动保存"

[dependencies]
eframe = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
