[package]
name = "Memo"
version = "0.1.0"
edition = "2021"
description = "Memo - 现代、简单、轻量的 Windows 便签，自动保存"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

